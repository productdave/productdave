<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">David Wang — Product leader, AI builder, founder</title>
  <desc id="desc">A clean white GitHub cover with a yellow David Wang monogram and bold black typography.</desc>
  <rect width="1200" height="360" rx="24" fill="#FFFFFF"/>
  <rect x="4" y="4" width="1192" height="352" rx="20" fill="none" stroke="#111111" stroke-width="8"/>

  <g aria-label="DW monogram">
    <circle cx="154" cy="164" r="86" fill="#FFE028"/>
    <text x="154" y="188" text-anchor="middle" fill="#050505" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="63" font-weight="900" letter-spacing="-7">DW</text>
    <g transform="translate(197 218) rotate(-45)">
      <rect width="46" height="12" rx="2" fill="#050505"/>
      <rect y="18" width="37" height="10" rx="2" fill="#050505"/>
      <rect y="34" width="28" height="8" rx="2" fill="#050505"/>
    </g>
  </g>

  <text x="286" y="132" fill="#111111" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-2.4">DAVID WANG</text>
  <rect x="288" y="156" width="624" height="4" fill="#FFE028"/>
  <text x="288" y="202" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">PRODUCT LEADER  •  AI BUILDER  •  FOUNDER</text>
  <text x="288" y="249" fill="#343434" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">I create products that solve deep, valuable customer problems.</text>

  <g transform="translate(1040 64)" fill="#111111">
    <rect width="82" height="12"/>
    <rect y="22" width="58" height="12"/>
    <rect y="44" width="34" height="12"/>
  </g>
  <rect x="1028" y="297" width="96" height="12" fill="#FFE028"/>
</svg>
